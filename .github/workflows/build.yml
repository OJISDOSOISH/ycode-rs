name: build

# Compilation et tests de ycode.
#
# Tout se passe sur les runners GitHub : ta machine ne compile jamais rien, et
# c'est voulu. Le binaire produit est publie en artefact, tel quel, sans
# installation ni dependances.
#
# Le cache cargo est partage entre versions de la toolchain quand c'est
# possible : sur un gros portage, recompiler toutes les dependances a chaque
# commit coute plus cher que le code lui-meme.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# On ne passe PAS `-D warnings`. Un portage en cours produit naturellement des
# imports et des methodes encore inutilises, et les traiter en erreurs ferait
# echouer la compilation pour des raisons sans rapport avec la correction du
# code. Le lint strict est une decision de fin de portage, pas de debut.

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: ycode-windows

    steps:
      - uses: actions/checkout@v4

      # Sonde d'integrite, AVANT toute compilation.
      #
      # Motif : un hash SHA-1 de port donne `3485e413...` sur l'entree vide au
      # lieu de `da39a3ee...`, alors que le code source est le SHA-1 canonique
      # caractere par caractere et que 262 144 variantes de la fonction de tour
      # ont ete ecartees. Une contradiction entre un code lisible et un resultat
      # d'execution ne se tranche pas en relisant le code : elle se tranche en
      # comparant ce que la machine voit a ce que le depot contient.
      #
      # Cette etape verifie deux choses, toutes deux observables, aucune ne
      # compile rien :
      #   1. le fichier que cargo va compiler est bien celui du commit, pas une
      #      version venue d'ailleurs - le symptome que nous avons deja subi en
      #      local, ou des modifications non commitees changeaient le binaire
      #      sans que personne ne le sache ;
      #   2. les trois implementations de SHA-1 disponibles sur cette machine
      #      concordent. Si elles divergeaient, c'est la machine qui ment, et
      #      aucun resultat de test du jour n'est probant.
      - name: Sonde d'integrite
        shell: bash
        run: |
          set -u
          echo "--- fichier source, blob du commit contre fichier sur disque ---"
          for f in src/swarm/util_hash.rs src/core/fs_util.rs; do
            if git cat-file -e "HEAD:$f" 2>/dev/null; then
              a=$(git show "HEAD:$f" | sha256sum | cut -d' ' -f1)
              b=$(sha256sum "$f" | cut -d' ' -f1)
              if [ "$a" = "$b" ]; then
                echo "  $f  IDENTIQUE  $a"
              else
                echo "  $f  DIVERGENT"
                echo "    commit : $a"
                echo "    disque : $b"
                echo "    ERREUR: cargo ne compilera pas ce que le commit contient."
                exit 1
              fi
            else
              echo "  $f  absent du commit"
            fi
          done

          echo "--- SHA-1 de la chaine vide, trois implementations ---"
          ref="da39a3ee5e6b4b0d3255bfef95601890afd80709"
          got=""
          if command -v node >/dev/null 2>&1; then
            n=$(node -e 'process.stdout.write(require("crypto").createHash("sha1").update("").digest("hex"))')
            echo "  node    $n"; [ -z "$got" ] && got="$n"
          fi
          if command -v python >/dev/null 2>&1 || command -v python3 >/dev/null 2>&1; then
            py=$(python -c 'import hashlib,sys;sys.stdout.write(hashlib.sha1(b"").hexdigest())' 2>/dev/null \
              || python3 -c 'import hashlib,sys;sys.stdout.write(hashlib.sha1(b"").hexdigest())')
            echo "  python  $py"
            if [ -n "$got" ] && [ "$py" != "$got" ]; then
              echo "    ERREUR: node et python divergent sur SHA-1."
              exit 1
            fi
            [ -z "$got" ] && got="$py"
          fi
          echo "  attendu $ref"
          if [ -n "$got" ] && [ "$got" != "$ref" ]; then
            echo "    ERREUR: la machine ne calcule pas le SHA-1 de reference."
            exit 1
          fi
          echo "  OK"

      - name: Installer Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cacher les dependances cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Verifier le format
        run: cargo fmt --all -- --check
        continue-on-error: true

      - name: Compiler les tests
        id: compile
        shell: bash
        run: cargo test --no-run --target ${{ matrix.target }} 2>&1 | tee compile.log; test ${PIPESTATUS[0]} -eq 0

      # Pas de doctests ici : leur compilation (rustdoc, un binaire par
      # bloc ``` sur Windows MSVC) coute a elle seule plus de 20 min et
      # masquait tout signal. Les doctests auront leur propre job plus tard.
      - name: Test coordinator simple
        if: always()
        # Plafond par etape : une pendaison doit couter des minutes, pas les
        # 6 h du plafond global. Run 50 a consumed 6 h sur ce seul test.
        timeout-minutes: 10
        shell: bash
        run: cargo test --target ${{ matrix.target }} --lib --bins --tests -- --exact core::session::run_coordinator::tests::execution_simple_sans_concurrence 2>&1 | tee -a tests.log; test ${PIPESTATUS[0]} -eq 0

      - name: Test coordinator wake coalesce
        if: always()
        timeout-minutes: 10
        shell: bash
        run: cargo test --target ${{ matrix.target }} --lib --bins --tests -- --exact core::session::run_coordinator::tests::wake_coalesce_plusieurs_wakes_en_un_seul_successeur 2>&1 | tee -a tests.log; test ${PIPESTATUS[0]} -eq 0

      - name: Test coordinator wake pendant execution
        if: always()
        timeout-minutes: 10
        shell: bash
        run: cargo test --target ${{ matrix.target }} --lib --bins --tests -- --exact core::session::run_coordinator::tests::wake_pendant_execution_planifie_un_successeur 2>&1 | tee -a tests.log; test ${PIPESTATUS[0]} -eq 0

      - name: Test coordinator cles differentes
        if: always()
        timeout-minutes: 10
        shell: bash
        run: cargo test --target ${{ matrix.target }} --lib --bins --tests -- --exact core::session::run_coordinator::tests::cles_differentes_s_executent_concurremment 2>&1 | tee -a tests.log; test ${PIPESTATUS[0]} -eq 0

      - name: Lancer les autres tests
        if: always()
        timeout-minutes: 120
        shell: bash
        run: cargo test --target ${{ matrix.target }} --lib --bins --tests -- --skip core::session::run_coordinator 2>&1 | tee -a tests.log; test ${PIPESTATUS[0]} -eq 0

      - name: Compiler la version optimisee
        run: cargo build --release --target ${{ matrix.target }}

      - name: Publier l'artefact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.target == 'x86_64-pc-windows-msvc' && 'target/x86_64-pc-windows-msvc/release/ycode.exe' || format('target/{0}/release/ycode', matrix.target) }}
          if-no-files-found: error

      # Exfiltration des erreurs sans acces aux logs (403 en anonyme) :
      # on re-emet chaque erreur en commande d'annotation GitHub, qui est
      # lisible sans authentification via l'API annotations (fichier+ligne).
      # Pas de push : le token du runner n'a pas l'ecriture (branche ci-logs
      # restee inexistante, constate sur le run precedent).
      # Le plafond GitHub est de 10 annotations par type et par step : une
      # erreur par annotation ne pouvait donc jamais montrer plus de 6 a 10
      # erreurs. On batche 10 erreurs par annotation (une seule ligne, separees
      # par " || "), soit 100 erreurs couvertes par les 10 slots disponibles.
      - name: Publier erreurs compilation
        if: failure() && steps.compile.conclusion == 'failure'
        run: |
          if (!(Test-Path compile.log)) {
            Write-Output "::error ::exfil: compile.log ABSENT (tee n'a rien ecrit)"
          } else {
            $lignes = @(Get-Content compile.log)
            $errs = New-Object System.Collections.Generic.List[string]
            $cur = $null
            foreach ($raw in $lignes) {
              $l = $raw -replace "`e\[[0-9;]*m", ""
              if ($l -match '^error(\[E\d+\])?: (.*)') {
                $msg = $Matches[2]
                if ($msg -notmatch '^(aborting due to|could not compile)') {
                  if ($cur) { $errs.Add("?: $cur") }
                  $cur = $msg
                }
              }
              elseif ($cur -and $l -match '-->\s+([^:]+):(\d+)') {
                $errs.Add("$($Matches[1]):$($Matches[2]): $cur")
                $cur = $null
              }
            }
            if ($cur) { $errs.Add("?: $cur") }

            Write-Output "::notice ::exfil: $($lignes.Count) lignes log, $($errs.Count) erreurs localisees"
            if ($errs.Count -eq 0) {
              $lignes | Select-Object -First 25 | ForEach-Object { Write-Output "::notice ::LOG: $_" }
            } else {
              $items = @($errs | ForEach-Object {
                if ($_.Length -gt 170) { $_.Substring(0,170) + '...' } else { $_ }
              })
              $batch = 10
              $slots = 9
              for ($i = 0; $i -lt $slots; $i++) {
                $start = $i * $batch
                if ($start -ge $items.Count) { break }
                $end = [Math]::Min($start + $batch - 1, $items.Count - 1)
                $seg = $items[$start..$end] -join ' || '
                Write-Output "::error ::exfil $($start+1)-$($end+1)/$($items.Count): $seg"
              }
              $couvert = [Math]::Min($slots * $batch, $items.Count)
              if ($items.Count -gt $couvert) {
                Write-Output "::notice ::exfil: $($items.Count - $couvert) erreurs restantes non publiees"
              }
            }
          }

      # Exfiltration des echecs de tests, meme mecanique que la compilation :
      # les logs sont 403 en anonyme, donc chaque test en echec est re-emit
      # en annotation, batche 10 par annotation (plafond GitHub: 10 par step).
      - name: Publier echecs tests
        if: failure()
        run: |
          if (Test-Path tests.log) {
            $lignes = @(Get-Content tests.log)
            $resultats = @($lignes | Where-Object { $_ -match '^test result:' })
            if ($resultats.Count -eq 0) { exit 0 }
            Write-Output "::notice ::tests: $($resultats -join ' | ')"

            $echecs = @($lignes | Where-Object { $_ -match '^test .* \.\.\. FAILED' } |
                        ForEach-Object { ($_ -replace '^test (.+) \.\.\. FAILED', '$1').Trim() } |
                        Select-Object -Unique)
            if ($echecs.Count -eq 0) { exit 0 }

            # Bloc de sortie de chaque test en echec : 3 lignes non vides
            # (panique, message, left/right de l'assertion).
            $blocs = @{}
            $cur = $null
            foreach ($l in $lignes) {
              if ($l -match '^---- (.+) stdout ----') {
                $cur = $Matches[1]
                if (-not $blocs.ContainsKey($cur)) { $blocs[$cur] = @() }
              }
              elseif ($l -match '^---- ') { $cur = $null }
              elseif ($cur -and $blocs[$cur].Count -lt 3 -and $l.Trim().Length -gt 0) {
                $blocs[$cur] += $l.Trim()
              }
            }

            $items = @($echecs | ForEach-Object {
              $detail = ''
              if ($blocs.ContainsKey($_)) { $detail = ' :: ' + ($blocs[$_] -join ' | ') }
              $s = "$_$detail"
              if ($s.Length -gt 300) { $s.Substring(0, 300) + '...' } else { $s }
            })
            $batch = 10
            $slots = 9
            for ($i = 0; $i -lt $slots; $i++) {
              $start = $i * $batch
              if ($start -ge $items.Count) { break }
              $end = [Math]::Min($start + $batch - 1, $items.Count - 1)
              $seg = $items[$start..$end] -join ' || '
              Write-Output "::error ::tests $($start+1)-$($end+1)/$($items.Count): $seg"
            }
            $couvert = [Math]::Min($slots * $batch, $items.Count)
            if ($items.Count -gt $couvert) {
              Write-Output "::notice ::tests: $($items.Count - $couvert) echecs restants non publies"
            }
          }
