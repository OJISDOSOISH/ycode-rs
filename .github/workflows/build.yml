name: build

# Compilation et tests de ycode.
#
# Tout se passe sur les runners GitHub : ta machine ne compile jamais rien, et
# c'est voulu. Le binaire produit est publie en artefact, tel quel, sans
# installation ni dependances.
#
# Le cache cargo est partage entre versions de la toolchain quand c'est
# possible : sur un gros portage, recompiler toutes les dependances a chaque
# commit coute plus cher que le code lui-meme.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# On ne passe PAS `-D warnings`. Un portage en cours produit naturellement des
# imports et des methodes encore inutilises, et les traiter en erreurs ferait
# echouer la compilation pour des raisons sans rapport avec la correction du
# code. Le lint strict est une decision de fin de portage, pas de debut.

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: ycode-windows

    steps:
      - uses: actions/checkout@v4

      - name: Installer Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cacher les dependances cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Verifier le format
        run: cargo fmt --all -- --check
        continue-on-error: true

      - name: Compiler les tests
        id: compile
        shell: bash
        run: cargo test --no-run --target ${{ matrix.target }} 2>&1 | tee compile.log; test ${PIPESTATUS[0]} -eq 0

      # Pas de doctests ici : leur compilation (rustdoc, un binaire par
      # bloc ``` sur Windows MSVC) coute a elle seule plus de 20 min et
      # masquait tout signal. Les doctests auront leur propre job plus tard.
      - name: Test coordinator simple
        if: always()
        run: cargo test --target ${{ matrix.target }} --lib --bins --tests -- --exact core::session::run_coordinator::tests::execution_simple_sans_concurrence

      - name: Test coordinator wake coalesce
        if: always()
        run: cargo test --target ${{ matrix.target }} --lib --bins --tests -- --exact core::session::run_coordinator::tests::wake_coalesce_plusieurs_wakes_en_un_seul_successeur

      - name: Test coordinator wake pendant execution
        if: always()
        run: cargo test --target ${{ matrix.target }} --lib --bins --tests -- --exact core::session::run_coordinator::tests::wake_pendant_execution_planifie_un_successeur

      - name: Test coordinator cles differentes
        if: always()
        run: cargo test --target ${{ matrix.target }} --lib --bins --tests -- --exact core::session::run_coordinator::tests::cles_differentes_s_executent_concurremment

      - name: Lancer les autres tests
        if: always()
        run: cargo test --target ${{ matrix.target }} --lib --bins --tests -- --skip core::session::run_coordinator

      - name: Compiler la version optimisee
        run: cargo build --release --target ${{ matrix.target }}

      - name: Publier l'artefact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.target == 'x86_64-pc-windows-msvc' && 'target/x86_64-pc-windows-msvc/release/ycode.exe' || format('target/{0}/release/ycode', matrix.target) }}
          if-no-files-found: error

      # Exfiltration des erreurs sans acces aux logs (403 en anonyme) :
      # on re-emet chaque erreur en commande d'annotation GitHub, qui est
      # lisible sans authentification via l'API annotations (fichier+ligne).
      # Pas de push : le token du runner n'a pas l'ecriture (branche ci-logs
      # restee inexistante, constate sur le run precedent).
      - name: Publier erreurs compilation
        if: failure() && steps.compile.conclusion == 'failure'
        run: |
          $cur = $null
          foreach ($l in Get-Content compile.log) {
            if ($l -match '^error(\[E\d+\])?: (.*)') { $cur = $Matches[2] }
            elseif ($cur -and $l -match '-->\s+([^:]+):(\d+)') {
              Write-Output "::error file=$($Matches[1]),line=$($Matches[2])::$cur"
              $cur = $null
            }
          }
