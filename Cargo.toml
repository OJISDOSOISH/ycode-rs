[package]
name = "ycode"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
anyhow = "1"
thiserror = "2"
async-trait = "0.1"
uuid = { version = "1", features = ["v4", "v7", "serde"] }

[lib]
name = "ycode"
path = "src/lib.rs"

[[bin]]
name = "ycode"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
